[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[functions."market-snapshot"]
  # Free tier max is typically 10s; stay under that in code too.
  timeout = 10

[functions."market-quote"]
  timeout = 6

[functions."sports-bulletin"]
  timeout = 8

[functions."og"]
  timeout = 4

# Inject per-share og:image meta for ?view=share crawlers / link previews
[[edge_functions]]
  function = "share-meta"
  path = "/*"

# Market API before the SPA fallback
[[redirects]]
  from = "/api/market/snapshot"
  to = "/.netlify/functions/market-snapshot"
  status = 200
  force = true

[[redirects]]
  from = "/api/market/quote"
  to = "/.netlify/functions/market-quote"
  status = 200
  force = true

[[redirects]]
  from = "/api/sports/bulletin"
  to = "/.netlify/functions/sports-bulletin"
  status = 200
  force = true

[[redirects]]
  from = "/api/og"
  to = "/.netlify/functions/og"
  status = 200
  force = true

# SPA / PWA client routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
