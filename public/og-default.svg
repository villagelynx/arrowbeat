<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1920" viewBox="0 0 1280 1920" role="img" aria-label="ArrowBeat">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#050b12"/>
      <stop offset="45%" stop-color="#0b1520"/>
      <stop offset="100%" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5dffa8"/>
      <stop offset="55%" stop-color="#12d46b"/>
      <stop offset="100%" stop-color="#0a8f48"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#12d46b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#12d46b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="1920" fill="url(#bg)"/>
  <rect width="1280" height="1920" fill="url(#glow)"/>
  <text x="640" y="150" text-anchor="middle" font-family="Inter, system-ui, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="80" font-weight="800" fill="#e8eef5">Arrow<tspan fill="#12d46b">Beat</tspan></text>
  <text x="640" y="215" text-anchor="middle" font-family="Inter, system-ui, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#8fa3b8">Daily market probability</text>
  <text x="640" y="420" text-anchor="middle" font-family="Inter, system-ui, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#e8eef5">Share today's lean</text>
  <text x="640" y="520" text-anchor="middle" font-family="Inter, system-ui, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#e8eef5">ArrowBeat Score</text>
  <g transform="translate(640 920) scale(1.75)">
    <path fill="url(#arrow)" d="M0 -118 L78 18 H42 V128 H-42 V18 H-78 Z"/>
  </g>
  <text x="640" y="1400" text-anchor="middle" font-family="Inter, system-ui, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" fill="#8fa3b8">arrowbeat.com</text>
</svg>
