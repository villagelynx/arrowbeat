[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[functions."market-snapshot"]
  # Free tier max is typically 10s; stay under that in code too.
  timeout = 10

[functions."market-lean"]
  timeout = 10

[functions."market-quote"]
  timeout = 6

[functions."market-news"]
  timeout = 10

[functions."market-corrections"]
  timeout = 10

[functions."sports-bulletin"]
  timeout = 8

[functions."og"]
  timeout = 4

# Correct MIME for SEO files (must exist in dist from /public)
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
# Inject per-share og:image meta for ?view=share crawlers / link previews
[[edge_functions]]
  function = "share-meta"
  path = "/*"

# Market API before the SPA fallback
[[redirects]]
  from = "/api/market/snapshot"
  to = "/.netlify/functions/market-snapshot"
  status = 200
  force = true

[[redirects]]
  from = "/api/market/lean"
  to = "/.netlify/functions/market-lean"
  status = 200
  force = true

[[redirects]]
  from = "/api/market/quote"
  to = "/.netlify/functions/market-quote"
  status = 200
  force = true

[[redirects]]
  from = "/api/market/news"
  to = "/.netlify/functions/market-news"
  status = 200
  force = true

[[redirects]]
  from = "/api/market/corrections"
  to = "/.netlify/functions/market-corrections"
  status = 200
  force = true

[[redirects]]
  from = "/api/sports/bulletin"
  to = "/.netlify/functions/sports-bulletin"
  status = 200
  force = true

[[redirects]]
  from = "/api/og"
  to = "/.netlify/functions/og"
  status = 200
  force = true

# Never rewrite SEO files to the SPA shell
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = false

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = false

# SPA / PWA client routes (static files in dist win when present)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
